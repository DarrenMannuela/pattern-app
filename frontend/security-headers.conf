# Security headers for every response (included in each location, since a
# location's own add_header would otherwise drop the server's).
#
# The page may only load its own scripts, its own and Google's fonts, and
# its own and data:/blob: images (reference photos, logos being prepared);
# it may only talk to its own address; and no other site may frame it.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
