# The app and its API on one address. /api goes to the backend container;
# everything else is the built React app.
server {
    listen 80;
    root /usr/share/nginx/html;
    server_tokens off;
    include /etc/nginx/security-headers.conf;

    # An order can carry a reference photo and a logo upload can be a few MB.
    client_max_body_size 40m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://backend:8080;
        # The address as the browser typed it, port included: the backend
        # answers only its own page and this computer's own names.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Reading a photo with a local model or nesting a big order takes minutes.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Built files have hashed names: they can be cached for good.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The app manifest (for installing on a phone) under its own media type,
    # which nginx doesn't know.
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
